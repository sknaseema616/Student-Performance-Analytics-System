{% extends "base.html" %}

{% block title %}Courses{% endblock %}

{% block content %}

<div class="page-header">

    <h1>Courses</h1>

    <a
        href="{{ url_for('routes.new_course') }}"
        class="btn-primary"
    >
        + Add Course
    </a>

</div>


<div class="table-container">

    <table>

        <thead>

            <tr>

                <th>ID</th>

                <th>Course Name</th>

                <th>Course Code</th>

                <th>Actions</th>

            </tr>

        </thead>


        <tbody>

            {% for course in courses %}

            <tr>

                <td>
                    {{ course.id }}
                </td>

                <td>
                    {{ course.name }}
                </td>

                <td>
                    {{ course.code }}
                </td>

                <td>

                    <div class="actions">

                        <a
                            href="{{ url_for('routes.course_detail', id=course.id) }}"
                            class="btn-view"
                        >
                            View
                        </a>


                        <a
                            href="{{ url_for('routes.edit_course', id=course.id) }}"
                            class="btn-edit"
                        >
                            Edit
                        </a>


                        <form
                            method="POST"
                            action="{{ url_for('routes.delete_course', id=course.id) }}"
                            onsubmit="return confirm('Are you sure you want to delete this course?');"
                        >

                            <button
                                type="submit"
                                class="btn-delete"
                            >
                                Delete
                            </button>

                        </form>

                    </div>

                </td>

            </tr>

            {% else %}

            <tr>

                <td
                    colspan="4"
                    style="text-align: center;"
                >
                    No courses found.
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
