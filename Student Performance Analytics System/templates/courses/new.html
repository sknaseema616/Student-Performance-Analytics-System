{% extends "base.html" %}

{% block content %}

<h1>Add Course</h1>

<form method="POST" action="{{ url_for('routes.create_course') }}">

    <label>Course Name</label>

    <input
        type="text"
        name="name"
        required
    >

    <br>

    <label>Course Code</label>

    <input
        type="text"
        name="code"
        required
    >

    <br>

    <button type="submit">
        Add Course
    </button>

</form>

{% endblock %}
