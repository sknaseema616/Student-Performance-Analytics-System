{% extends "base.html" %}

{% block content %}

<h1>Add Student</h1>

<form method="POST" action="{{ url_for('routes.create_student') }}">

    <label>Name</label>

    <input
        type="text"
        name="name"
        required
    >

    <br>

    <label>Email</label>

    <input
        type="email"
        name="email"
        required
    >

    <br>

    <button type="submit">
        Add Student
    </button>

</form>

{% endblock %}
