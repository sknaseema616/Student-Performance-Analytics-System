{% extends "base.html" %}

{% block title %}Students{% endblock %}

{% block content %}

<div class="page-header">

    <h1>Students</h1>

    <a
        href="{{ url_for('routes.new_student') }}"
        class="btn-primary"
    >
        + Add Student
    </a>

</div>


<div class="table-container">

    <table>

        <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>Actions</th>

            </tr>

        </thead>


        <tbody>

            {% for student in students %}

            <tr>

                <td>
                    {{ student.id }}
                </td>

                <td>
                    {{ student.name }}
                </td>

                <td>
                    {{ student.email }}
                </td>

                <td>

                    <div class="actions">

                        <a
                            href="{{ url_for('routes.student_detail', id=student.id) }}"
                            class="btn-view"
                        >
                            View
                        </a>


                        <a
                            href="{{ url_for('routes.edit_student', id=student.id) }}"
                            class="btn-edit"
                        >
                            Edit
                        </a>


                        <form
                            method="POST"
                            action="{{ url_for('routes.delete_student', id=student.id) }}"
                            onsubmit="return confirm('Are you sure you want to delete this student?');"
                        >

                            <button
                                type="submit"
                                class="btn-delete"
                            >
                                Delete
                            </button>

                        </form>

                    </div>

                </td>

            </tr>

            {% else %}

            <tr>

                <td
                    colspan="4"
                    style="text-align: center;"
                >
                    No students found.
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
